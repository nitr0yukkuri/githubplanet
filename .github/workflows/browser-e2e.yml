name: Browser end-to-end tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: githubplanet
          POSTGRES_PASSWORD: password
          POSTGRES_DB: githubplanet_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U githubplanet -d githubplanet_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify durable webhook storage with disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://githubplanet:password@localhost:5432/githubplanet_e2e
        run: node --test test/webhook-persistence.integration.test.js
      - name: Run browser end-to-end tests
        env:
          E2E_DATABASE_URL: postgresql://githubplanet:password@localhost:5432/githubplanet_e2e
        run: npm run test:e2e
