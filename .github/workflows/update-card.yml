name: Update Planet Card

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fetch and Save Image
        env:
          SYSTEM_API_KEY: ${{ secrets.SYSTEM_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SYSTEM_API_KEY}" ]; then
            echo "SYSTEM_API_KEY secret is not set."
            exit 1
          fi

          curl --fail --location --show-error --silent \
            --max-time 180 \
            --retry 3 \
            --retry-delay 5 \
            --output profile_card.png \
            "https://githubplanet-git-543426763451.asia-northeast2.run.app/api/card/nitr0yukkuri?api_key=${SYSTEM_API_KEY}"

          if ! file profile_card.png | grep -q "PNG image data"; then
            echo "Downloaded file is not a PNG image."
            file profile_card.png
            exit 1
          fi

      - name: Create update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: actions/update-planet-card
          delete-branch: true
          commit-message: Update planet card image
          title: Update planet card image
          body: |
            Automated update for `profile_card.png`.

            Generated by the scheduled GitHub Actions workflow.

      - name: Summary
        run: |
          if [ -n "${{ steps.create-pr.outputs.pull-request-url }}" ]; then
            echo "Created or updated PR: ${{ steps.create-pr.outputs.pull-request-url }}"
          else
            echo "No profile card changes detected."
          fi
