name: Update Animated Planet Card

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-animated-planet-card
  cancel-in-progress: true

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install chromium --with-deps

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Record existing card animation
        env:
          CARD_RECORD_URL: https://githubplanet-git-543426763451.asia-northeast2.run.app/card.html?username=nitr0yukkuri&fix=true
          CARD_RECORD_WIDTH: '1200'
          CARD_RECORD_HEIGHT: '400'
          CARD_RECORD_WARMUP_MS: '2000'
          CARD_RECORD_MS: '5000'
        run: node scripts/record-profile-card.mjs

      - name: Convert recording to GIF
        run: |
          set -euo pipefail
          ffmpeg -y \
            -sseof -5 \
            -i artifacts/profile-card.webm \
            -vf "fps=15,scale=800:266:flags=lanczos,split[frames][palette_source];[palette_source]palettegen=stats_mode=diff[palette];[frames][palette]paletteuse=dither=sierra2_4a:diff_mode=rectangle" \
            -loop 0 \
            profile_card.gif

      - name: Validate GIF
        run: |
          set -euo pipefail

          file profile_card.gif | grep -q "GIF image data"

          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 profile_card.gif)"
          if [ "$dimensions" != "800x266" ]; then
            echo "Unexpected GIF dimensions: $dimensions"
            exit 1
          fi

          size_bytes="$(stat --format=%s profile_card.gif)"
          if [ "$size_bytes" -gt 10485760 ]; then
            echo "GIF is larger than 10 MiB: $size_bytes bytes"
            exit 1
          fi

          echo "Validated profile_card.gif ($dimensions, $size_bytes bytes)."

      - name: Publish GIF to asset branch
        run: |
          set -euo pipefail

          asset_branch="card-assets"
          asset_dir="$(mktemp -d)"
          cp profile_card.gif "$asset_dir/profile_card.gif"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan generated-card-assets
          git rm --recursive --force . || true
          cp "$asset_dir/profile_card.gif" profile_card.gif
          git add profile_card.gif
          git commit -m "Update animated planet card [skip ci]"
          git push --force origin "HEAD:$asset_branch"

      - name: Summary
        run: |
          echo "Animated card published to card-assets/profile_card.gif."
