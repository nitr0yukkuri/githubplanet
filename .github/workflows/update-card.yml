name: Update Animated Planet Card

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-animated-planet-card
  cancel-in-progress: true

jobs:
  build-card-assets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run application tests
        # 壊れたコードからGIFだけを生成して公開しないため、素材生成より先に検証する。
        run: npm test

      - name: Smoke test deployed showcase routes
        # 本番URLの表示/API障害を検知して、異常な公開素材の更新を止める。
        env:
          SMOKE_BASE_URL: https://githubplanet.dev
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.SMOKE_BASE_URL;
          const checks = [
            {
              path: '/demo?showcase=ruby',
              validate: (text) => text.includes('id="canvas-container"')
            },
            {
              path: '/api/planets/showcase/ruby',
              validate: (text) => JSON.parse(text).mainLanguage === 'Ruby'
            }
          ];

          for (const check of checks) {
            const response = await fetch(`${baseUrl}${check.path}`, {
              signal: AbortSignal.timeout(15_000)
            });
            const body = await response.text();
            if (!response.ok || !check.validate(body)) {
              throw new Error(`Smoke test failed: ${check.path} (${response.status})`);
            }
            console.log(`Smoke test passed: ${check.path}`);
          }
          NODE

      - name: Install Playwright browser
        run: npx --no-install playwright install chromium --with-deps

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Record animated cards
        env:
          CARD_RECORD_WIDTH: '1200'
          CARD_RECORD_HEIGHT: '400'
          CARD_RECORD_WARMUP_MS: '2000'
          CARD_RECORD_MS: '5000'
        run: |
          set -euo pipefail
          mkdir -p generated-card-assets

          record_card() {
            local output_name="$1"
            local card_url="$2"
            local record_ms="${3:-5000}"
            local record_seconds=$((record_ms / 1000))

            CARD_RECORD_URL="$card_url" CARD_RECORD_MS="$record_ms" node scripts/record-profile-card.mjs
            ffmpeg -y \
              -sseof "-$record_seconds" \
              -i artifacts/profile-card.webm \
              -vf "fps=15,scale=800:266:flags=lanczos,split[frames][palette_source];[palette_source]palettegen=stats_mode=diff[palette];[frames][palette]paletteuse=dither=sierra2_4a:diff_mode=rectangle" \
              -loop 0 \
              "generated-card-assets/$output_name"
          }

          base_url="https://githubplanet.dev/card.html"
          record_card profile_card.gif "$base_url?username=nitr0yukkuri&fix=true" 8000
          record_card showcase_css.gif "$base_url?showcase=css&fix=true"
          record_card showcase_cpp.gif "$base_url?showcase=cpp&fix=true"
          record_card showcase_go.gif "$base_url?showcase=go&fix=true"
          record_card showcase_typescript.gif "$base_url?showcase=typescript&fix=true"
          record_card showcase_javascript.gif "$base_url?showcase=javascript&fix=true"
          record_card showcase_java.gif "$base_url?showcase=java&fix=true"
          record_card showcase_kotlin.gif "$base_url?showcase=kotlin&fix=true"
          record_card showcase_rust.gif "$base_url?showcase=rust&fix=true"
          record_card showcase_vue.gif "$base_url?showcase=vue&fix=true"
          record_card showcase_ruby.gif "$base_url?showcase=ruby&fix=true"
          record_card showcase_python.gif "$base_url?showcase=python&fix=true"

      - name: Validate GIF
        run: |
          set -euo pipefail

          test "$(find generated-card-assets -maxdepth 1 -name '*.gif' | wc -l)" -eq 12

          for gif in generated-card-assets/*.gif; do
            file "$gif" | grep -q "GIF image data"

            dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$gif")"
            if [ "$dimensions" != "800x266" ]; then
              echo "Unexpected GIF dimensions for $gif: $dimensions"
              exit 1
            fi

            size_bytes="$(stat --format=%s "$gif")"
            if [ "$size_bytes" -gt 10485760 ]; then
              echo "$gif is larger than 10 MiB: $size_bytes bytes"
              exit 1
            fi

            echo "Validated $gif ($dimensions, $size_bytes bytes)."
          done

      - name: Upload validated GIFs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: generated-card-assets
          path: generated-card-assets/*.gif
          if-no-files-found: error
          retention-days: 1

  publish-card-assets:
    needs: build-card-assets
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download validated GIFs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: generated-card-assets
          path: generated-card-assets

      - name: Publish GIFs to asset branch
        run: |
          set -euo pipefail
          test "$(find generated-card-assets -maxdepth 1 -name '*.gif' | wc -l)" -eq 12
          for gif in generated-card-assets/*.gif; do
            file "$gif" | grep -q "GIF image data"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan generated-card-assets
          git rm --recursive --force . || true
          cp generated-card-assets/*.gif .
          git add -- *.gif
          git commit -m "Update animated planet cards [skip ci]"
          git push --force origin HEAD:card-assets

      - name: Summary
        run: echo "Animated profile and showcase cards published to card-assets."
