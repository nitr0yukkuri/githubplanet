<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Planet Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <script>
        // URLに 'fix' が含まれていたら、ページ表示前に強制的にクラスをつける
        if (window.location.search.includes('fix')) {
            document.documentElement.classList.add('is-screenshot');
        }
    </script>

    <link rel="stylesheet" href="/front/css/card.css">

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls.js": "/vendor/three/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>
</head>

<body data-i18n-title="card.pageTitle">
    <div class="nav-container">
        <a href="/" class="back-button" data-i18n="common.backToPlanet">＜ 惑星に戻る</a>
    </div>

    <div class="content-wrapper">
        <div id="card-container">
            <div class="bg-gradient"></div>
            <div class="stars"></div>

            <div id="planet-canvas"></div>

            <div class="card-content">
                <div class="header-section">
                    <div class="id-label">GITHUB PLANET // <span id="planet-name-sub">UNKNOWN PLANET</span></div>
                    <h1 id="username-display" class="user-name">USERNAME</h1>
                </div>

                <div class="stats-row">
                    <div class="stat-group">
                        <span class="stat-label" data-i18n="card.language">LANGUAGE</span>
                        <span class="stat-value" id="main-lang-stat">LOADING</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-group">
                        <span class="stat-label" data-i18n="card.contributions">CONTRIBUTIONS</span>
                        <span class="stat-value" id="commits-val">0000</span>
                    </div>
                </div>

                <div class="footer-section">
                    <div class="lang-label-row">
                        <span data-i18n="card.systemStatus">SYSTEM STATUS</span>
                        <span class="sys-status" data-i18n="card.online">● ONLINE</span>
                    </div>
                    <div class="bar-track">
                        <div id="lang-bar" class="bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="share-container" id="share-section">
            <p data-i18n="card.share">👇 下のURLをコピーしてgithubのプロフィールに貼ろう！</p>
            <div class="code-box">
                <code id="markdown-code">LOADING...</code>
                <button id="copy-btn" title="コピー" data-i18n-attr="title:card.copy,aria-label:card.copy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
            <p style="font-size: 0.75rem; color: #6e7a8e; margin-top: 15px;" data-i18n="common.disclaimer">※GitHub PlanetはGitHub公式とは一切関係ありません。</p>
        </div>
    </div>

    <script type="module" src="/front/js/card.js"></script>
</body>

</html>
